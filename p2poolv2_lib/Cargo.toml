[package]
name = "p2poolv2_lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
hydrapool-pplns-accounting = []
test-utils = ["dep:rand", "dep:tempfile", "p2poolv2_config/test-utils"]
# No-PoW load-test simulation. Stubs out proof-of-work verification on the
# share-validation path and disables auto block-submission so synthetic shares
# can be emitted without hashing. MUST NEVER be enabled in a release build.
# See docs/simulation/load-test-plan.md.
sim = ["dep:rand"]

[dependencies]
# Optional test utilities dependencies
rand = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
libp2p = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rocksdb = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
zmq = { workspace = true }
bitcoin = { workspace = true }
p2poolv2_wallet = { workspace = true }
bitcoinconsensus = { workspace = true }
# Curve arithmetic for Bitcoin Cash Schnorr share signatures (shares/bch_script.rs).
k256 = { workspace = true }
base64 = { workspace = true }
tower = { workspace = true, features = ["util", "limit"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
tracing-appender = { workspace = true }
bitcoindrpc = { path = "../bitcoindrpc" }
p2poolv2_config = { path = "../p2poolv2_config" }
chrono = { workspace = true }
dashmap = { workspace = true }
uint = { workspace = true }
rlimit = "0.11.0"
binary_sv2 = "7.0.0"
job_declaration_sv2 = "10.0.0"
common_messages_sv2 = "9.0.0"
framing_sv2 = "8.0.0"
codec_sv2 = { version = "7.0.0", features = ["noise_sv2"] }
noise_sv2 = "2.0.0"
mining_sv2 = "12.0.0"

[dev-dependencies]
bitcoindrpc = { path = "../bitcoindrpc", features = ["test-utils"] }
p2poolv2_config = { path = "../p2poolv2_config", features = ["test-utils"] }
tempfile.workspace = true
test-log = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
rand = { workspace = true }
wiremock = { workspace = true }
mockall.workspace = true
mockall_double.workspace = true
temp-env = { workspace = true }
tokio-test.workspace = true
criterion.workspace = true

[[bench]]
name = "pplns_window"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "sum_u64"
harness = false
