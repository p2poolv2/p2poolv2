---
# Nginx reverse proxy for P2Poolv2 (Debian/Ubuntu only)

# Rate limiting
p2poolv2_nginx_rate_limit: "10r/s"
p2poolv2_nginx_rate_burst: 20

# Let's Encrypt email for certificate registration
p2poolv2_certbot_email: ""
# Fail the play when `certbot renew --dry-run` fails, so a broken renewal
# shows up at deploy time instead of when the certificates expire
p2poolv2_certbot_renew_check: true

# Grafana reverse proxy (optional, set domain to enable)
# p2poolv2_grafana_domain: "grafana.example.com"
p2poolv2_grafana_port: 3000
# Send visitors without a Grafana session from the grafana domain root to
# this public dashboard, e.g. "/public-dashboards/<access token>".
# Empty shows the Grafana login page instead.
p2poolv2_grafana_public_dashboard_path: ""

# Site configs in sites-enabled to remove, e.g. a hand-written config that
# p2poolv2.conf replaces. Nothing else is removed.
p2poolv2_nginx_remove_sites: []
