---
# Grafana + Prometheus for P2Poolv2 metrics

# Grafana listens here. Use 127.0.0.1 behind nginx, 0.0.0.0 for LAN access.
p2poolv2_grafana_listen_address: "127.0.0.1"
p2poolv2_grafana_port: 3000
p2poolv2_grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Datasource name and uid are P2Poolv2-specific so they never collide with
# a Prometheus datasource the operator already has in the same Grafana.
p2poolv2_grafana_datasource_name: "Prometheus (P2Poolv2)"
p2poolv2_grafana_datasource_uid: "prometheus-p2poolv2"

# Prometheus is only read by the local Grafana, so it stays on localhost
p2poolv2_prometheus_listen_address: "127.0.0.1"
p2poolv2_prometheus_port: 9090
p2poolv2_prometheus_scrape_interval: "15s"

# Extra scrape targets besides the p2poolv2 instances, e.g.
#   - job_name: node
#     target: "localhost:9100"
p2poolv2_prometheus_extra_targets: []

# Per-OS packaging differences
p2poolv2_grafana_binary: "{{ '/usr/bin/grafana' if ansible_os_family == 'Archlinux' else '/usr/share/grafana/bin/grafana' }}"
p2poolv2_grafana_service: "{{ 'grafana' if ansible_os_family == 'Archlinux' else 'grafana-server' }}"
p2poolv2_grafana_config_file: "{{ '/etc/grafana.ini' if ansible_os_family == 'Archlinux' else '/etc/grafana/grafana.ini' }}"
p2poolv2_prometheus_args_file: "{{ '/etc/conf.d/prometheus' if ansible_os_family == 'Archlinux' else '/etc/default/prometheus' }}"
p2poolv2_prometheus_args_variable: "{{ 'PROMETHEUS_ARGS' if ansible_os_family == 'Archlinux' else 'ARGS' }}"

# Same paths on every OS; Grafana is pointed at them through its environment
p2poolv2_grafana_provisioning_dir: /etc/grafana/provisioning
p2poolv2_grafana_data_dir: /var/lib/grafana
p2poolv2_grafana_dashboards_dir: /var/lib/grafana/dashboards
