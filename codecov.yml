codecov:
  require_ci_to_pass: true

coverage:
  status:
    # Off: the blocking total-coverage check is coverage/gate, posted by
    # .github/workflows/coverage-gate.yml without depending on Codecov.
    project: off
    # Advisory: reported on every PR but does not block merge.
    patch:
      default:
        target: 90%
        informational: true

ignore:
  - tools/log_dashboard/
  - load_tests
  - docs
  - docker
