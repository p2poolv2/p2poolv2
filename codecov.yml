codecov:
  require_ci_to_pass: true

coverage:
  status:
    # Blocking: a patch must not lower total coverage relative to its base
    # commit. The threshold absorbs run-to-run noise from timing-dependent
    # async tests.
    project:
      default:
        target: auto
        threshold: 0.1%
    # Advisory: reported on every PR but does not block merge.
    patch:
      default:
        target: 90%
        informational: true

ignore:
  - tools/log_dashboard/
  - load_tests
  - docs
  - docker
