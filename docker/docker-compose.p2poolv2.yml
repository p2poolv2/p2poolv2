# Base p2poolv2 service definition, extended by docker-compose.yml and
# docker-compose.node.yml. Do not run this file directly.
#
# IMPORTANT: p2poolv2 uses host networking (network_mode: host) because Docker's
# bridge NAT adds an extra NAT layer that breaks inbound P2P connections without
# additional port forwarding or libp2p configuration for the Docker bridge.
# Host networking sidesteps this by binding directly to host interfaces.
# This only works on Linux.
#
# With host networking:
#   - p2poolv2 binds directly to host ports (no port mapping)
#   - bitcoind URL must use 127.0.0.1 (not Docker DNS name 'bitcoind')
#   - mujina_minerd connects via host ports (needs host networking or host IP)
#
# Run with: docker compose up -d p2poolv2

services:
  p2poolv2:
    image: p2poolv2:latest
    build:
      context: ..
      dockerfile: docker/p2poolv2/Dockerfile
    env_file: .env
    environment:
      # Nested config keys use `__` as the separator so that single
      # underscores stay part of a field name. P2POOL_CONFIG is read by clap
      # rather than the config crate, so it keeps a single underscore.
      - P2POOL_STRATUM__NETWORK=${NETWORK:-signet}
      - P2POOL_BITCOINRPC__URL=http://127.0.0.1:${BTC_RPC_PORT:-38332}
      - P2POOL_STORE__PATH=/p2poolv2/data/${NETWORK:-signet}
      - P2POOL_CONFIG=/etc/p2poolv2/config.toml
      - P2POOL_STRATUM__PORT=${P2POOL_STRATUM_PORT:-3333}
      - P2POOL_API__PORT=${P2POOL_API_PORT:-46884}
      - P2POOL_NETWORK__LISTEN_ADDRESS=/ip4/${P2POOL_P2P_HOST:-0.0.0.0}/tcp/${P2POOL_P2P_PORT:-6884}
    network_mode: host
    volumes:
      - p2poolv2_data:/p2poolv2
      - ../${P2POOL_CONFIG:-config.toml}:/etc/p2poolv2/config.toml:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  mujina_minerd:
    profiles: [developer]
    scale: ${MUJINA_SCALE:-1}
    image: ghcr.io/256foundation/mujina-minerd:main
    depends_on:
      p2poolv2:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - docker.host.internal:host-gateway
    environment:
      - RUST_LOG=${MUJINA_RUST_LOG:-trace}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  p2poolv2_data:
