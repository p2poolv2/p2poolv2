[network]
listen_address = "/ip4/127.0.0.1/tcp/6884"
dial_peers = []
max_pending_incoming = 10
max_pending_outgoing = 10
max_established_incoming = 50
max_established_outgoing = 50
# Two, not one: room for an inbound and an outbound connection when two
# nodes dial each other at once. More only duplicates traffic -- libp2p
# multiplexes every protocol over a single connection.
max_established_per_peer = 2
max_workbase_per_second = 10
max_userworkbase_per_second = 10
max_miningshare_per_second = 100
max_inventory_per_second = 100
max_transaction_per_second = 100
max_requests_per_second = 100
dial_timeout_secs = 30
# Optional external address for nodes behind NAT. If set, this address
# is advertised to peers instead of auto-detecting from identify observations.
# external_address = "/ip4/203.0.113.1/tcp/6884"

[store]
path = "./store.db"
background_task_frequency_hours = 24
pplns_ttl_days = 7

[stratum]
hostname = "0.0.0.0"
port = 3333
start_difficulty = 10000
minimum_difficulty = 100
solo_address = "tb1qyazxde6558qj6z3d9np5e6msmrspwpf6k0qggk"
# Pool operating mode: "p2poolv2" (share chain) or "hydrapool"
# (standalone PPLNS, no share chain). Default p2poolv2.
# mode = "p2poolv2"
# Share chain address owning every share this node mines. In p2poolv2
# mode a share needs an owner, so a miner that does not send
# p2p=<address> in its stratum password gets this address instead.
# Leave it unset only if every one of your miners sends p2p=; otherwise
# they are rejected at authorize.
# Not valid with mode = "hydrapool", which has no share chain.
#
# Set this to YOUR OWN share chain address before enabling it. There is
# deliberately no default: any address published here would own the shares
# of everyone who copied this file, and a placeholder would silently burn
# them.
#
# Note a configured address is authoritative, so a miner that sends a
# different p2p=<address> is rejected as a conflict. Set this only if you
# want every share to belong to the node.
# miner_address = "sp2pool1..."
# The bitcoin address to use for first jobs when there are no shares
bootstrap_address = "tb1qyazxde6558qj6z3d9np5e6msmrspwpf6k0qggk"
# Any donation amount for developers to be sent to donation address.
# On Bitcoin the default is no donation, and both fields must be set together.
# On Bitcoin Cash (chain = "bitcoin-cash") the donation goes to the built-in
# P2Poolv2 address bitcoincash:qze95tc2dqrnltvxfa5yhunwx5952f34fvw4g6365k
# (same key under bchtest: and bchreg:), and the default is 150 basis points
# (1.5%) of each block this node finds. Set donation to raise or lower it, or
# to 0 to opt out. donation_address may be left out there; if set it must be
# that same address, because the share chain rejects a Bitcoin Cash donation
# paid anywhere else.
# donation_address = "tb1qyazxde6558qj6z3d9np5e6msmrspwpf6k0qggk"
# In basis points, 1% = 100 basis points. Default 0 on Bitcoin, 150 on Bitcoin Cash
# donation = 0
# Any fee amount for node/hydrapool provider to be sent to fee address. Default no fee.
# This is where a public pool operator takes their own cut. It is taken after
# the donation. On Bitcoin Cash, donation plus fee may not exceed 1000 basis
# points (10%); peers reject shares above that.
# fee_address = "tb1qyazxde6558qj6z3d9np5e6msmrspwpf6k0qggk"
# In basis points, 1% = 100 basis points. Default 0
# fee = 0
zmqpubhashblock = "tcp://127.0.0.1:28332"
# Block chain for templates and payout scripts. Default "bitcoin".
# "bitcoin-cash" fetches BCHN templates without SegWit rules and requires
# CashAddr payout addresses. A configured miner_address on that chain is a
# CashAddr share address (p2pool, tp2pool, or rp2pool), not a payout address.
# chain = "bitcoin"
# Required with chain = "bitcoin-cash": "mainnet", "chipnet", or "regtest".
# bitcoin_cash_network = "chipnet"
# Main or mini Bitcoin Cash share chain. Default "main". "mini" is rejected
# unless chain is "bitcoin-cash". Mini's share target is 256 times easier.
# bch_share_chain = "main"
# Stratum V2 listen port. Absent means the node does not open an SV2 socket.
# Local frames are unencrypted, so keep it on localhost or a trusted LAN.
# A Mining connection opens standard or extended channels with
# user_identity "<payout address>.<worker>"; its shares belong to
# miner_address, which p2poolv2 mode then requires. Job Declaration
# connections are served too. Bitcoin Cash jobs include one AuxPoW output.
# sv2_port = 3336
# Noise encryption for Stratum V2, signed by your authority key. Set both
# keys, in the Stratum V2 reference implementation's text form, to require
# the encrypted handshake on every SV2 connection; miners pin the public key.
# Make the keys with an external tool (this node never generates keys) and
# prefer the env var P2POOL__STRATUM__SV2_AUTHORITY_SECRET_KEY for the secret.
# sv2_authority_public_key = "9b..."
# sv2_authority_secret_key = "..."
# Seconds each Noise certificate stays valid. Default 3600.
# sv2_cert_validity_secs = 3600
# The share-chain network can be "main", "testnet4" or "signet".
# On Bitcoin this also selects the bech32m share address. On Bitcoin Cash it
# is ignored and derived from bitcoin_cash_network, so every node on one
# Bitcoin Cash network agrees on difficulty and the P2P protocol id.
network = "signet"
# Use BIP 323 mask for version rolling (see https://github.com/bitcoin/bips/blob/622e47722cd35514e96da37ae89f868e18d581e4/bip-0323.mediawiki#specification)
version_mask = "1fffffe0"
# The difficulty multiplier defines the window size for calculating payout proportions
# See https://github.com/p2poolv2/p2poolv2/wiki/Difficult-Multiplier on how to choose this
difficulty_multiplier = 1.0
# Add a pool signature, if you want. Comment out the line if you want
# to mine anonymous blocks. This signature is only used to show others
# how large your pool is, if you are running private, there is no need
# to add a pool signature. Maximum length 16 bytes.
pool_signature = "P2Poolv2"
# Maximum concurrent stratum connections (default: 90% of OS file descriptor limit)
# max_connections = 1000

[bitcoinrpc]
# RPC credentials are loaded from env vars
url = "http://127.0.0.1:38332"
username = "p2pool"
password = "p2pool"

[logging]
# Specify a file path for the log file, if no log file is specified, console logging will be used
file = "./logs/p2pool.log"
console = true
level = "info"
# Pool, user and worker stats are dumped for consumption by stats tools
stats_dir = "./logs/stats"

[api]
hostname = "127.0.0.1"
port = 46884
# Optional authentication credentials
# auth_user = "admin"
# auth_token is of the format salt:password-hmac. Use can p2poolv2_cli gen-auth to generate a token.
# auth_token = "your_secret_token"
# auth_password is the raw password for p2poolv2_cli client auth only. Do not set on server config.
# auth_password = "your_password"
# Enable permissive CORS (careful with this; allows any origin)
# cors_allowed = false
