# Supply-chain policy for P2Poolv2. See docs in the cargo-deny book:
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# Only the platforms we publish images for (see .github/workflows/docker.yml).
# Scoping this keeps Windows- and macOS-only crates out of every check.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
]

[licenses]
# P2Poolv2 ships binaries under AGPL-3.0-or-later, so dependency licences must
# be compatible with distributing a linked AGPL work. Permissive licences are;
# GPL-2.0-only would not be. Every entry below was observed in the actual tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "MITNFA",
]
confidence-threshold = 0.93

# Our own crates are publish = false, so their licence is our decision, not a
# dependency policy question. Skipping them keeps this file agnostic to any
# future relicence of the workspace itself.
private = { ignore = true }

[bans]
# Duplicate majors cannot be denied outright while bitcoin 0.32 pins rand 0.8.
# Cargo only hard-errors on duplicate `links` crates, so this check is the only
# thing that catches version skew. Keep the skip list short and commented.
multiple-versions = "warn"
# Catch an accidental `foo = "*"` on a registry dependency, but allow the
# version-less path deps between our own crates (the workspace is publish = false).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Advisories are the one check that can turn CI red overnight on unchanged
# code, so this runs non-blocking until the dependency upgrades land. The
# ignore list is deliberately empty: the current advisories are the baseline
# this upgrade work is measured against, not noise to be suppressed.
# Triage procedure and the ignore-entry format live in audit.toml.
# Shorter than the list in .cargo/audit.toml, and deliberately so. cargo-audit
# scans the whole lockfile; this file scopes the graph to the platforms we ship
# (see [graph] targets), which already excludes the lockfile-only crates. Only
# advisories cargo-deny can actually see belong here - listing the rest makes it
# report "no crate matched advisory criteria". Triage lives in the audit config.
ignore = [
    "RUSTSEC-2026-0119",  # hickory-proto 0.24.4, via libp2p-dns
]
yanked = "deny"
unmaintained = "workspace"
