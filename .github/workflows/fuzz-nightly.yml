name: Nightly Fuzz

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz-deep:
    runs-on: ubuntu-26.04
    # One hour of fuzzing plus build, corpus sync and artifact upload. A cold
    # build (new nightly pin or lockfile change) alone can take about 30
    # minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        fuzz_target: [wire_message_decode]
    # rust-toolchain.toml pins stable, but cargo-fuzz needs nightly, and the
    # nested cargo builds it spawns would otherwise pick up the pinned stable.
    # The nightly is dated because rust-cache keys on `rustc -vV`: a moving
    # nightly makes every day's first run a cold build. Bump it deliberately.
    #
    # cargo-fuzz defaults --target to the triple it was itself built for. The
    # prebuilt binary from install-action is musl, and AddressSanitizer
    # cannot run against a statically linked libc, so name the gnu target.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-31
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz@0.13.2

      # The corpus repo holds one directory per fuzz target. A target new to
      # the repo starts from an empty directory, which libFuzzer requires to
      # exist.
      - name: Clone shared fuzz corpus
        env:
          FUZZ_CORPUS_TOKEN: ${{ secrets.FUZZ_CORPUS_TOKEN }}
        run: |
          git clone "https://x-access-token:${FUZZ_CORPUS_TOKEN}@github.com/p2poolv2/fuzz-corpus" "$RUNNER_TEMP/corpora"
          mkdir -p "$RUNNER_TEMP/corpora/${{ matrix.fuzz_target }}"

      # The fuzz crate is its own workspace with its own target directory.
      # cargo-fuzz comes from install-action each run, so ~/.cargo/bin is not
      # cached: a restored binary would shadow the pinned version.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: p2poolv2_lib/fuzz -> target
          cache-bin: "false"
          # Save compiled dependencies even when the job fails (a crash or a
          # timeout), so the next run does not start cold again.
          cache-on-failure: "true"
          key: fuzz-nightly-${{ matrix.fuzz_target }}

      - name: Run fuzz target (1 hour)
        working-directory: p2poolv2_lib
        run: cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.fuzz_target }} "$RUNNER_TEMP/corpora/${{ matrix.fuzz_target }}" -- -max_total_time=3600

      - name: Push newly discovered corpus entries back
        working-directory: ${{ runner.temp }}/corpora
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Nightly fuzz: add newly discovered corpus entries"
          git push

      - name: Upload crash artifacts, if any
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.fuzz_target }}
          path: p2poolv2_lib/fuzz/artifacts/${{ matrix.fuzz_target }}/
