name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.99.0

      - name: Install latest nextest release
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run tests
        run: cargo nextest run --workspace

      - name: Run sim-feature tests
        run: cargo nextest run -p p2poolv2_lib --features sim

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov,nextest
      # Without a cache every run rebuilds librocksdb-sys from C++ source
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Run coverage through nextest so it uses the same runner as the test
      # job. Plain `cargo test` runs the whole workspace in one process per
      # crate, which changes test semantics for anything touching process
      # state and can fail here while passing there.
      - name: Generate code coverage
        run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      # This job compiles and runs PR code, including build scripts of newly
      # proposed dependency versions, so it holds no secrets. It only saves the
      # report; coverage-upload.yml sends it to Codecov from a workflow_run
      # that holds CODECOV_TOKEN but never executes PR code. That keeps the
      # token away from every PR, Dependabot's included, without skipping any.
      - name: Record pull request number
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PULL_REQUEST_NUMBER" > pull-request-number
      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            lcov.info
            pull-request-number
          # coverage-gate.yml compares PRs against the newest main report, so
          # main keeps its report long enough to survive quiet periods.
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
          if-no-files-found: error
