version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:08"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR a week for everything semver-compatible. Ungrouped, a tree of
      # this size produces an unreviewable stream.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors here are not ordinary upgrades: merging one without coordinating
      # a release breaks the network or the on-disk store. They are migrated by
      # hand, with the verification described in docs/dependency-upgrades.md.
      # Majors for every other crate are left to Dependabot, because a proposal
      # is useful signal even when it needs manual work.
      - dependency-name: "libp2p"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rocksdb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bitcoinconsensus"
        update-types: ["version-update:semver-major"]
      # bitcoin is ignored at minor too. Under cargo's 0.x rules 0.32 -> 0.33 is
      # semver-minor, but it is a consensus-serialization change affecting both
      # the p2p wire format and RocksDB keys.
      - dependency-name: "bitcoin"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # rust.yml and security.yml pin actions by SHA. Dependabot is what keeps
  # pinning sustainable, by proposing the new SHA with its version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      # release.yml is generated by cargo-dist from its own templates. A bump
      # merged here is lost on the next `dist generate`, and Dependabot then
      # reopens the same PR. Upgrade the actions it uses by upgrading
      # cargo-dist and regenerating instead.
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:16"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker/p2poolv2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:22"
    commit-message:
      prefix: "docker"
