[package]
name = "p2poolv2_config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-utils = ["bitcoindrpc/test-utils", "dep:serde_json", "config/json"]

[dependencies]
bitcoin = { workspace = true }
p2poolv2_wallet = { workspace = true }
bitcoindrpc = { workspace = true }
config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
temp-env = { workspace = true }
serde_json = { workspace = true }
tokio-test = { workspace = true }
# Feature unification from dev-deps makes config/json (FileFormat::Json)
# available to cfg(test) code such as Config::load_env.
config = { workspace = true, features = ["json"] }
bitcoindrpc = { workspace = true, features = ["test-utils"] }

[lib]
name = "p2poolv2_config"
path = "src/lib.rs"
