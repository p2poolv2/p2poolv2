[package]
name = "p2poolv2_node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "p2poolv2"

[lib]
name = "p2poolv2_node"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
serde = { workspace = true }
bitcoin = { workspace = true }
bitcoindrpc = { workspace = true }
p2poolv2_api = { workspace = true }
p2poolv2_cli = { path = "../p2poolv2_cli" }
p2poolv2_lib = { workspace = true }

[[bin]]
name = "p2poolv2"
path = "src/main.rs"

[[bin]]
name = "p2poolv2_cli"
path = "src/cli_main.rs"

[[bin]]
name = "verify_chain"
path = "src/verify_chain.rs"
required-features = ["debug-tools"]

[features]
debug-tools = []
# Sim build: short background task interval to match the sim prune depth.
# Enabled by p2poolv2_sim's sim feature; never in a release build.
sim = ["p2poolv2_lib/sim"]

[dev-dependencies]
p2poolv2_lib = { workspace = true, features = ["test-utils", "hydrapool-pplns-accounting"] }
mockall.workspace = true
mockall_double.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
