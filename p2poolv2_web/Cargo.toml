[package]
name = "p2poolv2_web"
description = "Interactive P2Poolv2 dashboard in Rust, compiled to WebAssembly"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Built for the browser with `trunk build` (see README.md). It also compiles
# natively so workspace tests, clippy and fmt cover it; only the pure logic
# (formatting, chart scaling, parsing) is unit tested there.
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "MouseEvent", "WheelEvent", "Element", "DomRect", "EventTarget", "Performance"] }
console_error_panic_hook = "0.1"

# Static web assets, not a native release binary.
[package.metadata.dist]
dist = false
