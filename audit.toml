# cargo-audit configuration.
#
# TRIAGE PROCEDURE
#
# cargo-audit reads Cargo.lock, which carries entries for target platforms and
# optional features this workspace never builds. Before adding an ignore entry,
# classify the advisory:
#
#   1. cargo tree -i <crate>@<version> --workspace --all-features
#      Nothing printed means it is not in the host build graph.
#   2. cargo tree -i <crate>@<version> --target all --all-features
#      Shows which target or feature would pull it in.
#   3. Classify as one of:
#      reachable and fixable  -> fix it, do not ignore
#      reachable but blocked  -> ignore, naming the upstream blocker
#      lockfile only          -> ignore, naming the target or feature
#
# Every ignore entry must carry the advisory id, the classification, the
# blocker, and the condition under which the entry is removed. An ignore list
# without removal conditions becomes permanent.
#
# The list below is intentionally empty. The advisories currently outstanding
# are the recorded baseline for the dependency upgrade work, not noise to be
# suppressed. Entries get added only for advisories that survive the upgrades.

[advisories]
ignore = []
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "low"
